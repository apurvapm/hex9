name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: |
          ./build/test_board
          ./build/test_mcts
          ./build/test_alphabeta
          ./build/test_puct
          ./build/test_encoding training/encoding_fixture.txt

      - name: Benchmark
        run: ./build/bench_board

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python tests
        run: |
          pip install -r training/requirements.txt
          cd training && python -m pytest -q

      - name: Self-play smoke test
        run: |
          ./build/selfplay --size=5 --heuristic --games=20 --sims=50 --out=smoke.bin
          cd training && python -m records_smoke ../smoke.bin

  sanitizers:
    name: asan and ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-asan -DHEX_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        run: |
          ./build-asan/test_board
          ./build-asan/test_mcts
          ./build-asan/test_alphabeta
          ./build-asan/test_puct
          ./build-asan/test_encoding
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # Enable once the threaded self-play driver exists.
