name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: |
          ./build/test_board
          ./build/test_mcts

      - name: Benchmark
        run: ./build/bench_board

  sanitizers:
    name: asan and ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-asan -DHEX_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        run: |
          ./build-asan/test_board
          ./build-asan/test_mcts
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

